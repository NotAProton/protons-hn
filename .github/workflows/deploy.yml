name: Build & deploy site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Firefox package
        run: pnpm build:firefox && pnpm zip:firefox

      - name: Build Chrome package
        run: pnpm build && pnpm zip

      - name: Stage site
        run: |
          mkdir -p site/downloads
          cp pages/index.html site/index.html
          VERSION=$(node -p "require('./package.json').version")
          sed -i "s/__VERSION__/$VERSION/" site/index.html
          cp .output/*.zip site/downloads/
          FIREFOX_ZIP=$(basename "$(ls .output/*firefox.zip | head -1)")
          CHROME_ZIP=$(basename "$(ls .output/*chrome.zip | head -1)")
          sed -i "s|id=\"dl-firefox\" href=\"downloads/\"|id=\"dl-firefox\" href=\"downloads/$FIREFOX_ZIP\"|" site/index.html
          sed -i "s|id=\"dl-chrome\" href=\"downloads/\"|id=\"dl-chrome\" href=\"downloads/$CHROME_ZIP\"|" site/index.html
          grep -o 'downloads/[a-z0-9.-]*\.zip' site/index.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
