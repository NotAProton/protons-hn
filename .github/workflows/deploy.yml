name: Build & deploy site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Auto-bump version (patch = run number)
        run: |
          BASE=$(node -p "require('./package.json').version.split('.').slice(0,2).join('.')")
          VERSION="$BASE.${GITHUB_RUN_NUMBER}"
          node -e "const fs=require('fs');const p=JSON.parse(fs.readFileSync('package.json','utf8'));p.version='$VERSION';fs.writeFileSync('package.json',JSON.stringify(p,null,2)+'\n')"
          echo "Building version $VERSION"

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Firefox package
        run: pnpm build:firefox && pnpm zip:firefox

      - name: Build Chrome package
        run: pnpm build && pnpm zip

      - name: Sign Firefox build (AMO unlisted)
        env:
          AMO_JWT_ISSUER: ${{ secrets.AMO_JWT_ISSUER }}
          AMO_JWT_SECRET: ${{ secrets.AMO_JWT_SECRET }}
        run: |
          if [ -z "$AMO_JWT_ISSUER" ] || [ -z "$AMO_JWT_SECRET" ]; then
            echo "AMO secrets not set; publishing unsigned zips only"
            exit 0
          fi
          pnpm exec web-ext sign \
            --source-dir .output/firefox-mv2 \
            --channel unlisted \
            --api-key "$AMO_JWT_ISSUER" \
            --api-secret "$AMO_JWT_SECRET" \
            --artifacts-dir .output/signed \
          || echo "SIGN_FAILED=1" >> "$GITHUB_ENV"

      - name: Stage site
        run: |
          mkdir -p site/downloads
          cp pages/index.html site/index.html
          cp pages/logo.svg site/logo.svg
          VERSION=$(node -p "require('./package.json').version")
          sed -i "s/__VERSION__/$VERSION/" site/index.html
          cp .output/*.zip site/downloads/

          # stable URLs that never change between deploys (Pages caches HTML
          # for up to 10 minutes; a stale page must never 404 on download)
          CHROME_ZIP=$(basename "$(ls .output/*chrome.zip | head -1)")
          cp ".output/$CHROME_ZIP" site/downloads/protons-hn-latest-chrome.zip

          if [ "$SIGN_FAILED" != "1" ] && ls .output/signed/*.xpi 1>/dev/null 2>&1; then
            cp .output/signed/*.xpi site/downloads/protons-hn-latest.xpi
            sed -i "s|__INSTALL_NOTE__|Click the download button and Firefox will offer to install the extension permanently.|" site/index.html
          else
            FIREFOX_ZIP=$(basename "$(ls .output/*firefox.zip | head -1)")
            cp ".output/$FIREFOX_ZIP" site/downloads/protons-hn-latest.zip
            sed -i "s|id=\"dl-firefox\" href=\"[^\"]*\"|id=\"dl-firefox\" href=\"downloads/protons-hn-latest.zip\"|" site/index.html
            sed -i "s|__INSTALL_NOTE__|The signed build is unavailable for this version (AMO refuses to sign the same version twice). Unzip the download and load it from about:debugging instead.|" site/index.html
          fi
          cp .output/*chrome.zip site/downloads/ 2>/dev/null || true
          grep -oE 'downloads/[a-z0-9.-]*\.(zip|xpi)' site/index.html | sort -u

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
