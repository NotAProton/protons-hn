<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141824" />
      <stop offset="50%" stop-color="#0d1017" />
      <stop offset="100%" stop-color="#06070a" />
    </linearGradient>

    <!-- Outer Rim Border Gradient -->
    <linearGradient id="rimGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2d3748" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#ff6600" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#1a202c" stop-opacity="0.6" />
    </linearGradient>

    <!-- Hacker News Vibrant Core Gradient -->
    <linearGradient id="hnGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF8A3D" />
      <stop offset="45%" stop-color="#FF6600" />
      <stop offset="100%" stop-color="#E64A00" />
    </linearGradient>

    <!-- Specular Highlight for Glassy Y Edge -->
    <linearGradient id="highlightGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.45" />
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity="0.05" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0" />
    </linearGradient>

    <!-- Primary Atomic Proton Orbit -->
    <linearGradient id="orbitGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF9E40" />
      <stop offset="40%" stop-color="#FF6600" />
      <stop offset="85%" stop-color="#705DF2" />
      <stop offset="100%" stop-color="#00E5FF" />
    </linearGradient>

    <!-- Proton Glow Radial Gradient -->
    <radialGradient id="protonGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="30%" stop-color="#FFE0B2" />
      <stop offset="65%" stop-color="#FF6600" stop-opacity="0.7" />
      <stop offset="100%" stop-color="#FF6600" stop-opacity="0" />
    </radialGradient>

    <!-- Ambient Dark Mode Core Glow -->
    <radialGradient id="coreAura" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FF6600" stop-opacity="0.28" />
      <stop offset="60%" stop-color="#FF4500" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>

    <!-- Glow Filter -->
    <filter id="neonBlur" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="14" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Base Icon Squircle (Dark Mode Surface) -->
  <rect x="20" y="20" width="472" height="472" rx="112" fill="url(#bgGrad)" stroke="url(#rimGrad)" stroke-width="3" />

  <!-- Inset Bevel Ring -->
  <rect x="23" y="23" width="466" height="466" rx="109" fill="none" stroke="#FFFFFF" stroke-opacity="0.04" stroke-width="2" />

  <!-- Ambient Energy Flare -->
  <circle cx="256" cy="260" r="160" fill="url(#coreAura)" />

  <!-- Semantic Search & Telemetry Rings (Subtle Radar Accents) -->
  <circle cx="256" cy="260" r="195" fill="none" stroke="#FF6600" stroke-opacity="0.07" stroke-width="1.5" />
  <circle cx="256" cy="260" r="135" fill="none" stroke="#FF6600" stroke-opacity="0.09" stroke-width="1.5" stroke-dasharray="5 7" />

  <!-- Secondary Counter-Orbit (Deep Space Indigo) -->
  <ellipse cx="256" cy="260" rx="175" ry="52" transform="rotate(40 256 260)" fill="none" stroke="#6C5CE7" stroke-width="2.5" stroke-dasharray="8 12" stroke-opacity="0.4" />

  <!-- Primary Proton Orbit Track (Background Section) -->
  <ellipse cx="256" cy="260" rx="185" ry="62" transform="rotate(-30 256 260)" fill="none" stroke="url(#orbitGrad1)" stroke-width="4" stroke-opacity="0.8" filter="url(#softGlow)" />

  <!-- Hacker News "Y" Ambient Underglow -->
  <g filter="url(#neonBlur)" opacity="0.6">
    <path d="M 164 148 L 256 268 L 256 376 M 348 148 L 256 268" fill="none" stroke="#FF4500" stroke-width="58" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- Hacker News "Y" Main Structure -->
  <path d="M 164 148 L 256 268 L 256 376 M 348 148 L 256 268" fill="none" stroke="url(#hnGrad)" stroke-width="50" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Subtle Ergonomic Specular Highlight on Left Ridge -->
  <path d="M 168 152 L 254 266 L 254 372" fill="none" stroke="url(#highlightGrad)" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" />

  <!-- High-Energy Proton Particle (Accelerating Orbit Node) -->
  <!-- Outer Glow Flare -->
  <circle cx="417" cy="192" r="26" fill="url(#protonGlow)" />
  <!-- Core Shell -->
  <circle cx="417" cy="192" r="11" fill="#FF8533" filter="url(#softGlow)" />
  <!-- Fusion Nucleus -->
  <circle cx="417" cy="192" r="6" fill="#FFFFFF" />

  <!-- Orbit Tail Sparks (Speed/Performance Motif) -->
  <circle cx="396" cy="210" r="4" fill="#FFA347" opacity="0.8" />
  <circle cx="374" cy="225" r="2.5" fill="#FF7700" opacity="0.5" />
  <circle cx="350" cy="237" r="1.5" fill="#FF6600" opacity="0.3" />

  <!-- Opposing Quantum Node (Archive / Semantic Counter-Node) -->
  <circle cx="95" cy="328" r="5" fill="#00E5FF" filter="url(#softGlow)" opacity="0.85" />
  <circle cx="95" cy="328" r="2" fill="#FFFFFF" />

  <!-- Intelligence / Speed Star Glint -->
  <path d="M 358 136 Q 358 144 350 144 Q 358 144 358 152 Q 358 144 366 144 Q 358 144 358 136 Z" fill="#FFFFFF" opacity="0.9" />
</svg>
